<!-- 4. Cálculo da média da SPTech

Na faculdade SPTech o aluno tem 2 notas: A da "avaliação continuada" e a da "avaliação semestral". 
A média final é a soma simples entre 40% da "continuada" e 60% da "semestral". 
Assim, para ajudar um aluno para saber o quanto precisa para passar de semestre e estagiar em empresas como C6Bank, Tivit, 
Banco Safra, Deloitte, HP etc, crie um programa que:  

a) Solicite a nota que ele tirou na "continuada" e na "semestral"  

b) Solicite o nome do aluno  

c) Calcule sua média  

d) Exiba uma frase como esta "A média de NOME será de MEDIA". Onde NOME é o valor informado em b) e MEDIA, o valor calculado em c) -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 04</title>
  </head>
  <body>
    <span>Insira a sua nota continuada da SPTech:</span>
    <input type="number" id="input_continuada" />
    <br />

    <span>Insira a sua nota semestral da SPTech:</span>
    <input type="number" id="input_semestral" />
    <br />

    <span>Insira o seu nome:</span>
    <input type="text" id="input_nome" />
    <br />

    <button onclick="calcular()">Calcular</button>
    <div id="div_exibir"></div>
  </body>
</html>
<script>
  function calcular() {
    let notaContinuada = Number(input_continuada.value);
    let notaSemestral = Number(input_semestral.value);
    let nome = input_nome.value;

    let resultadoContinuada = notaContinuada * 0.4;
    let resultadoSemestral = notaSemestral * 0.6;
    
    let resultadoFinal = resultadoContinuada + resultadoSemestral;

    div_exibir.innerHTML = `A média de ${nome} será de ${resultadoFinal}`;
  }
</script>

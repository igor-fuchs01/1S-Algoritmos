<!-- 3. Controle de notas 

Paty é muito estudiosa e sua meta é sempre ser uma aluna fora de série. Na faculdade onde estuda, os "fora de série" são os alunos 
com média acima de 9,4. Portanto, para ajudá-la, crie um programa o qual:  

a) Pergunte o valor de 3 notas  

b) Ao clicar num botão "Analisar desempenho", calcule a média entre as notas e exiba na tela a frase "Sua média foi de X", onde X 
é a média calculada  

c) Somente caso a média for acima de 9,4 exibir também a frase "Parabéns, você é fora de série!"   -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03</title>
</head>
<body>
    <h1>Controle de Notas</h1>
    <span>Insira a primeira nota:</span>
    <input type="text" id="input_nota1"> <br> <br>
    <span>Insira a segunda nota:</span>
    <input type="text" id="input_nota2"> <br> <br>
    <span>Insira a segunda nota:</span>
    <input type="text" id="input_nota3"> <br> <br>
    <button onclick="analisar()">Analisar desempenho</button> <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function analisar(){
        let nota1 = Number(input_nota1.value);
        let nota2 = Number(input_nota2.value);
        let nota3 = Number(input_nota3.value);

        let media = (nota1 + nota2 + nota3) / 3;
        div_exibir.innerHTML = `Sua média foi de ${media.toFixed(2)} <br>`;

        if(media > 9.4){
            div_exibir.innerHTML += `Parabéns, você é fora de série!`;
        }
    }
</script>

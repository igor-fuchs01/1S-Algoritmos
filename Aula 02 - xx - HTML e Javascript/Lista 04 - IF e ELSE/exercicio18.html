<!-- 18. Mercado BOM DOCE 

Mercado BOM DOCE está em promoção, qualquer chocolate custa R$ 3,00 cada e se a compra for acima de uma 
dúzia de chocolates o preço cai para R$ 2,50 cada um. 
Criar um programa que auxilie o Mercado a calcular o valor da compra de chocolate 

a) Solicite a quantidade de chocolates comprados 

b) Após clicar num botão "Compra", exiba a mensagem "o valor da sua compra foi de XXX".   
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 18</title>
</head>
<body>
    <h1>Mercado BOM DOCE</h1>
    <span>Insira a quantidade de chocolates:</span>
    <input type="text" id="qtd_chocolates">
    <br><br>
    <button onclick="compra()">Compra</button>
    <br><br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function compra(){
        let qtdChocolates = Number(qtd_chocolates.value);
        let valor = 0;

        if(qtdChocolates > 12){
            valor = 2.50 * qtdChocolates;
        } else {
            valor = 3.0 * qtdChocolates;
        }

        div_exibir.innerHTML = `o valor da sua compra foi de ${valor.toFixed(2)}`;
    }
</script>

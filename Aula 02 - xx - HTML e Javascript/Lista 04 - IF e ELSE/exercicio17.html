<!-- 18. Teste de divisibilidade

Crie um programa no qual:

a)      Receba dois números

b)     Tenha o botão “Testar”, verifique se o primeiro número é divisível pelo segundo número. OBS. Um número é divisível 
por outro quando o resto da divisão entre eles é zero.

c)      Se for divisível mostrar uma imagem com um “positivo”, caso contrário, mostrar uma imagem “negativo”.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 18</title>
</head>
<body>
    <h1>Teste de divisibilidade</h1>
    <span>Insira o primeiro número:</span>
    <input type="text" id="ipt_num1">
    <br><br>
    <span>Insira o segundo número:</span>
    <input type="text" id="ipt_num2">
    <br><br>
    <button onclick="testar()">Testar</button>
    <div id="div_exibir"></div>
    
</body>
</html>
<script>
    function testar(){
        let num1 = Number(ipt_num1.value);
        let num2 = Number(ipt_num2.value);

        if((num1 % num2) == 0){
            div_exibir.innerHTML = `<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQat12493zPQzAhoB1XsU_OFN7cOyPMr5Wpb-DN5d9nrA&s=10">`;
        } else {
            div_exibir.innerHTML = `<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTH0qN4byyTKZjXMKRSMx8U-zalHOAeZCNv3Wu8QAl1KQ&s=10">`;
        }
    }
</script>

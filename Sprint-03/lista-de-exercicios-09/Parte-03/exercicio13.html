<!-- 
13. Lista de Compras
Crie um programa o qual:

a) Tenha os campos “Produto” e “Preço”, e um botão “Adicionar”;

b) Ao adicionar, exiba: “Café adicionado ao carrinho!”

c) Valide para não permitir, exibindo um alert de erro:

    Produto vazio

    Preço menor ou igual a 0

    Produto repetido

d) Ao clicar em “Ver carrinho”, exiba os produtos e seus preços em ordem inversa em que foram registrados, como:

    Produto 2 - Feijão - R$7.50

    Produto 1 - Arroz - R$10.00

e) Abaixo da listagem do carrinho, deve aparecer:

    Você tem X produtos no carrinho

    Total da compra: R$Y

    Produto mais caro: NOME (R$Z)

OBS: Utilize 2 vetores (nomes e preços), associados pelo índice, como no exercício 11. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 13</title>
</head>
<body>
    <span>Produto: </span>
    <input type="text" id="ipt_produto">
    <br> <br>
    <span>Preço: </span>
    <input type="text" id="ipt_preco">
    <br> <br>
    <button onclick="adicionar()">Adicionar</button>
    <button onclick="verCarrinho()">Ver Carrinho</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let listaProduto = [];
    let listaPreco = [];
    function adicionar(){
        let produto = ipt_produto.value;
        let preco = Number(ipt_preco.value);

        if(produto == '' || listaProduto.includes(produto) || preco <= 0){
            alert('[ERRO] Insira um valor válido!')
        } else {
            listaProduto.push(produto);
            listaPreco.push(preco);
            div_exibir.innerHTML = `${produto} adicionado ao carrinho!`;
        }
    }
    function verCarrinho(){
        let msg = '';
        let valorTotal = 0;
        let valorCaro = listaPreco[listaProduto.length - 1];
        let produtoCaro = listaProduto[listaProduto.length - 1];
        
        for(let i = listaProduto.length -1; i >= 0; i--){
            valorTotal += listaPreco[i];
            if(valorCaro < listaPreco[i]){
                valorCaro = listaPreco[i];
                produtoCaro = listaProduto[i];
            }
            msg += `Produto ${i} - ${listaProduto[i]} - R$${listaPreco[i].toFixed(2)} <br>`
        }

        msg += `
        <br>
        Você tem ${listaPreco.length} produtos no carrinho
        <br>
        Total da compra: R$${valorTotal}
        <br>
        Produto mais caro: ${produtoCaro} (R$${valorCaro})<br>`;

        div_exibir.innerHTML = msg;
    }
</script>

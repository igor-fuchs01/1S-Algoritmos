<!-- 15. Estacionamento
Crie um programa o qual:

a) Tenha um campo “Placa do veículo” e um botão “Estacionar”;

b) O estacionamento tem apenas 5 vagas. Ao estacionar, exiba: “Veículo ABC1234 estacionado! Restam X vagas.”

c) Não permita:

    Placa vazia (alert: "Preencha a placa do veículo!")

    Placa repetida (alert: “Esse veículo já está no estacionamento!”)

    Estacionar com todas as vagas ocupadas (alert: “Estacionamento lotado!”)

d) Tenha um campo “Buscar placa” e um botão “Buscar”. Ao clicar, exiba:

    “O veículo ABC1234 está na vaga 3”

OU

    “Esse veículo não está no estacionamento”

OBS: Considere que a primeira vaga é a vaga 1, e não a 0. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 15</title>
</head>
<body>
    <span>Placa do veículo: </span>
    <input type="text" id="ipt_placa_veiculo">
    <button onclick="estacionar()">Estacionar</button>
    <button onclick="buscarPlaca()">Buscar Placa</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let listaPlacas = [];
    function estacionar(){
        let placa = ipt_placa_veiculo.value;

        if(placa == ''){
            alert("Preencha a placa do veículo!")
        } else if(listaPlacas.includes(placa)){
            alert('Esse veículo já está no estacionamento!');
        } else if(listaPlacas.length >= 5){
            alert('Estacionamento lotado!');
        } else {
            listaPlacas.push(placa);
            div_exibir.innerHTML = `Veículo ${placa} estacionado! Restam ${5 - listaPlacas.length} vagas.`;
        }
    }

    function buscarPlaca(){
        let placa = ipt_placa_veiculo.value;
        
        let numVaga = listaPlacas.indexOf(placa);

        if(numVaga == -1){
            div_exibir.innerHTML = `Esse veículo não está no estacionamento`;
        } else {
            div_exibir.innerHTML = `O veículo ${placa} está na vaga ${numVaga + 1}`
        }
    }
</script>

<!-- 1. Parte 1
1. Lista Viva de Filmes Favoritos
Crie um programa o qual:

a) O usuário informa os nomes dos filmes que mais gosta e clica em "Cadastrar"; 
b) Na medida em que vai cadastrando, os filmes vão aparecendo um abaixo do outro, abaixo do botão.  -->
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01</title>
</head>
<body>
    <h1>Lista Viva de Filmes Favoritos</h1>
    <span>Informe o filme que você gosta: </span>
    <input type="text" id="ipt_filme">
    <button onclick="cadastrar()">Cadastrar</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let listaFilme = [];
    function cadastrar(){
        let filme = ipt_filme.value;
        listaFilme.push(filme);
        div_exibir.innerHTML = ``;

        for(let i = 0; i < listaFilme.length; i++){
            div_exibir.innerHTML += `${i + 1}. ${listaFilme[i]} <br>`;
        }
    }
</script>

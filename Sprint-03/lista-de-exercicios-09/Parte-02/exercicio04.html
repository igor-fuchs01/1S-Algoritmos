<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 04</title>
</head>
<body>
    <h1>Cadastro de Alunos com Exibição Invertida</h1>
    <span>Cadastre o nome dos alunos:</span>
    <input type="text" id="ipt_aluno">
    <button onclick="cadastrar()">Cadastrar</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let listaAlunos = [];
    function cadastrar(){
        let aluno = ipt_aluno.value;
        let msg = '';

        listaAlunos.push(aluno);

        for(let i = listaAlunos.length - 1; i >= 0; i--){
            msg += `Posição ${i}: ${listaAlunos[i]} <br>`;
        }

        div_exibir.innerHTML = msg;
    }
</script>

<!-- 9. Controle de Campanha de Time de Futebol com Análise de Aproveitamento
Crie um programa o qual:  
a) Cadastre a campanha de um time de futebol num campeonato da seguinte forma:  

a.1) Tenha um 'combo' (select/option) identificado com o texto "Indique o resultado" com os itens:  

  Vitória  

  Empate  

  Derrota  

b) Ao clicar num botão "Registrar jogo", o resultado escolhido em a) é registrado em um local invisível ao usuário e um texto abaixo é exibido (ou atualizado). O texto é como este:  

      O time teve: V vitórias, E empates, D derrotas  

      Pontuação total: X pontos  

      Aproveitamento: Y%  

Em que X é calculado assim: Cada vitória (V) vale 3 pontos. Cada empate (E) vale 1 ponto. Cada derrota (D) vale 0 pontos.  

O Y é o total de pontos conquistados (X) dividido pelo total de pontos possíveis (ou seja, considerando que tivesse vencido todos os jogos) vezes 100.  

c) Deve haver um campo "Indique qual jogo deseja saber o resultado". Na medida em que vai digitando, aparece um texto, abaixo do texto de b) como este:  

  No XXº jogo, o time Ganhou (ou "Perdeu" ou "Empatou")  

ou um texto como este, caso o valor seja de um jogo que não foi cadastrado:  

  Não foi cadastrado um XXº jogo  

Obs: Neste item considere que o usuário ache que 1 indica o 1º jogo. Ou seja, o usuário não imagina que o 1º é o jogo "0" na verdade.  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 09</title>
</head>
<body>
    <h1>Controle de Campanha de Time de Futebol com Análise de Aproveitamento</h1>

    <span>Indique o resultado: </span>
    <select id="select_resultado">
        <option value="3">Vitória</option>
        <option value="1">Empate</option>
        <option value="0">Derrota</option>
    </select>
    <button onclick="registrar()">Registrar jogo</button>
    <br>
    <span>Indique qual jogo deseja saber o resultado: </span>
    <input id="ipt_jogo" type="text" oninput="pesquisarJogo()">
    <br> <br>
    <div id="div_exibir"></div>
    <div id="div_jogo"></div>
</body>
</html>
<script>
    let partidas = [];

    function registrar(){
        let resultado = Number(select_resultado.value);
        let vitorias = 0;
        let empates = 0;
        let derrotas = 0;
        let pontuacaoTotal = 0;

        partidas.push(resultado);

        for(let i = 0; i < partidas.length; i++){
            let partida = partidas[i]
            if(partida == 0){
                derrotas++;
            } else if(partida == 1){
                empates++;
            } else {
                vitorias++;
            }
            pontuacaoTotal += partida;
        }

        div_exibir.innerHTML = `  
            O time teve: ${vitorias} vitórias, ${empates} empates, ${derrotas} derrotas  
            <br>
            Pontuação total: ${pontuacaoTotal} pontos  
            <br>
            Aproveitamento: ${((pontuacaoTotal / (partidas.length * 3)) * 100).toFixed(2)}% 
        `;
    }

    function pesquisarJogo(){
        let jogo = Number(ipt_jogo.value);

        if(jogo < 1 || jogo > partidas.length){
            div_jogo.innerHTML = `Não foi cadastrado um ${jogo}º jogo`;
        } else {
            let resultado = 'Perdeu';

            if(partidas[jogo - 1] == 3){
                resultado = 'Ganhou';
            } else if(partidas[jogo - 1] == 1){
                resultado = 'Empatou';
            }

            div_jogo.innerHTML = `No ${jogo}º jogo, o time ${resultado}`;
        }
    }

</script>

<!-- 
 6. Registro de Linhas de Ônibus com Pesquisa de Histórico
Crie um programa o qual:  
a) O usuário vá registrando os nomes das linhas de ônibus que ele pegou durante a semana. Ele digita o nome da linha e clica em "Gravar busão"; 

b) Cada vez que o botão é clicado o programa deve mostrar a lista de linhas de ônibus abaixo do botão e em ordem inversa (do último para o primeiro);  

c) Deve haver outro campo em que ele pesquisa por uma linha que já tenha pego. Ao clicar em "Pesquisar", deve ver uma dessas frases, abaixo da lista de linhas de ônibus que já pegou:  

   Você nunca pegou essa linha (caso não tenha cadastrado a linha em questão)  

   OU  

   Você já pegou essa linha 4 vezes, nos índices: 1, 3, 7, 8  

   (supondo que ele cadastrou a mesma linha na 2ª vez, na 4ª vez, na 8ª vez e na 9ª vez).

  OBS: Pode utilizar o .includes() para validar se existe o registro no vetor, antes mesmo de começar as iterações.
  OBS2: Utilize o for para iterar o vetor, percorrendo todos os itens. Quando encontrar um registro igual ao que o usuário pesquisou, 
  grave o índice no qual encontrou, para a mensagem final. Neste cenário, indexOf não daria certo, pois encontra apenas o primeiro 
  registro na lista. 
  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 06</title>
</head>
<body>
    <h1>Registro de Linhas de Ônibus com Pesquisa de Histórico</h1>
    <span>Registrar linha de busão utilizada:</span>
    <input type="text" id="ipt_linha">
    <button onclick="gravarBusao()">Gravar Busão</button>
    <br>
    <span>Pesquisar linha de busão utilizada:</span>
    <input type="text" id="ipt_pesquisar">
    <button onclick="pesquisar()">Pesquisar</button>
    <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let listaBusao = [];
    function gravarBusao(){
        let linha = ipt_linha.value;
        let msg = '';

        listaBusao.push(linha);

        for(let i = listaBusao.length - 1; i >= 0; i--){
            msg += `Index ${i}: ${listaBusao[i]} <br>`;
        }

        div_exibir.innerHTML = msg;
    }

    function pesquisar(){
        let pesquisar = ipt_pesquisar.value;
        let linhasEncontradas = [];
        if(listaBusao.includes(pesquisar)){
            for(let i = 0; i < listaBusao.length; i++){
                if(listaBusao[i] == pesquisar){
                    linhasEncontradas.push(i);
                }
            }
        }
        
        if(linhasEncontradas.length > 0){
            div_exibir.innerHTML = `Você já pegou essa linha ${linhasEncontradas.length} vezes, nos índices: ${String(linhasEncontradas).replaceAll(',', ', ')}`;
        } else {
            div_exibir.innerHTML = `Você nunca pegou essa linha `;
        }
    }
</script>

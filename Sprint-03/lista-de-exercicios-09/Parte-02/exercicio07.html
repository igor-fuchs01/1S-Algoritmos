<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 07</title>
</head>
<body>
    <span>Insira o preço do produto: </span>
    <input type="text" id="ipt_preco">
    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="atualizar()">Atualizar</button>
    <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let listaPreco = [];
    function cadastrar(){
        let preco = Number(ipt_preco.value);

        listaPreco.push(preco);

        div_exibir.innerHTML = `Você inseriu: ${preco} <br>`;
    }

    function atualizar(){
        let valor = 0;

        for(let i = listaPreco.length - 1; i >= 0; i--){
            div_exibir.innerHTML += `Produto ${i}: ${listaPreco[i]} <br>`
            valor += listaPreco[i];
        }

        div_exibir.innerHTML += `
            <br>
            Você tem ${listaPreco.length} produtos cadastrados em estoque  <br>
            Seu estoque vale R$ ${valor}
        `;
    }
</script>

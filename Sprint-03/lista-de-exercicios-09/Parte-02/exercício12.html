<!-- 10. Registro de Números com Histórico, Maior e Menor Valor
Crie um programa o qual:  
a) Tenha um campo "Digite um número qualquer";  

b) Tenha um botão "Analisar histórico" que ao ser clicado, o número é cadastrado em algum lugar e, em seguida, deve aparecer um histórico dos números cadastrados, bem como o maior e o menor, como no exemplo a seguir:  

   1º Número: 15  

   2º Número: 22  

   3º Número: 19  

   4º Número: 5  

   Maior: 22  

   Menor: 5  

OBS: Para encontrar o 'maior' e 'menor' valor, deve utilizar uma variável auxiliar e comparar todos os itens do vetor. 

            let minhaLista = [10, 20, 5, 8];
            let menorValor = minhaLista[0];   // começa com o número 10 sendo o menor valor;
            let maiorValor = minhaLista[0];   // começa com o número 10 sendo o maior valor;

        Para essa lista acima, eu posso afirmar que:

Na primeira iteração, o 10 é o maior e menor valor naquele momento, então criamos as variáveis utilizando minhaLista[0].
Na segunda iteração, 20 é maior que 10, então passa a ser o maior valor, enquanto 10 continua sendo o menor valor do vetor naquele momento.
Na terceira iteração, 5 é menor que 10, então passa a ser o menor valor, enquanto 20 continua sendo o maior valor do vetor naquele momento.
Na última iteração, 8 não é menor que 5 e nem maior que 20, então 5 continua sendo o menor valor, enquanto 20 continua sendo o maior valor do vetor naquele momento.
        Ao final dessas iterações, podemos afirmar que comparamos todos os números do vetor, iniciando com o valor 10, até encontrarmos algo que seja maior que o "maiorValor" e algo menor que o "menorValor", para reatribuir essas variáveis auxiliares.  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 12</title>
</head>
<body>
    <h1>12. Sistema Avançado de Estoque com Análise de Produtos e Estatística</h1>
    <span>Nome do produto: </span>
    <input type="text" id="ipt_produto">
    <br>
    <span>Digite um número qualquer: </span>
    <input type="text" id="ipt_numero">
    <br>
    <button onclick="analisar()">Analisar histórico</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let listaNumeros = [];
    let listaProdutos = [];
    function analisar(){
        let numero = Number(ipt_numero.value);
        let produto = ipt_produto.value;
        listaNumeros.push(numero);
        listaProdutos.push(produto);

        div_exibir.innerHTML = ``;

        // auxiliares do for
        let produtoMaior = listaProdutos[0];
        let produtoMenor = listaProdutos[0];
        let maior = listaNumeros[0];
        let menor = listaNumeros[0];
        let somaTotal = 0;
        for(let i = 0;i < listaNumeros.length; i++){
            div_exibir.innerHTML += `Produto ${i+1} - ${listaProduto[i]}: ${listaNumeros[i]} <br>`;

            // maior
            if(listaNumeros[i] > maior){
                maior = listaNumeros[i];
                produtoMaior = listaProdutos[i];
            }

            // menor
            if(listaNumeros[i] < menor){
                menor = listaNumeros[i];
                produtoMenor = listaProdutos[i];
            }

            somaTotal += listaNumeros[i];
        }

        div_exibir.innerHTML += `
            Maior -> ${produtoMaior}: ${maior.toFixed(2)} <br>
            Menor -> ${produtoMenor}: ${menor.toFixed(2)} <br>
            Soma -> ${somaTotal.toFixed(2)} <br>
            Média -> ${(somaTotal / listaNumeros.length).toFixed(2)}
            `;
    }
</script>

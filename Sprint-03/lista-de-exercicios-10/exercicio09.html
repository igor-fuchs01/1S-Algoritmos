<!-- 9. Cadastro de Viagens com Destino Internacional
Crie um programa o qual:

a) O usuário informe:

destino;
preço da viagem;
quantidade de dias;
b) Ao clicar em "Cadastrar Viagem", crie um objeto JSON chamado viagem;

c) Verifique:

se o preço for maior que 5000, crie o atributo tipo com valor "Internacional Premium";
caso contrário, "Viagem Nacional".
d) Exiba:

Destino: Paris
Preço: R$8000
Dias: 10
Tipo: Internacional Premium
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Destino:</span>
    <input type="text" id="ipt_destino">
    <span>Preço da viagem:</span>
    <input type="text" id="ipt_preco">
    <span>Quantidade de dias:</span>
    <input type="text" id="ipt_dias">
    <br> <br>
    <button onclick="cadastrarViagem()">Cadastrar Viagem</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>

    function cadastrarViagem(){
        let viagem = {
            destino: ipt_destino.value,
            preco: Number(ipt_preco.value),
            dias: Number(ipt_dias.value)
        };

        if(viagem.preco > 5000){
            viagem.tipo = `Internacional Premium`;
        } else {
            viagem.tipo = `Viagem Nacional`;
        }

        div_exibir.innerHTML = `
            Destino: ${viagem.destino} <br>
            Preço: R$${viagem.preco} <br>
            Dias: ${viagem.dias} <br>
            Tipo: ${viagem.tipo}
        `;
    }
</script>

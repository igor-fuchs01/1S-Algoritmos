<!-- 6. Cadastro de Carros com Remoção de Atributos
Crie um programa o qual:

a) O usuário informe:

marca do carro;
modelo;
ano;
b) Ao clicar em "Cadastrar Carro", crie um objeto JSON chamado carro;

c) Depois do cadastro:

crie um atributo chamado idade;
calcule a idade do carro usando o ano atual;
remova o atributo ano utilizando delete;
d) Exiba:

Marca: Toyota
Modelo: Corolla
Idade do carro: 6 anos
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Marca do carro:</span>
    <input type="text" id="ipt_marca">
    <span>Modelo:</span>
    <input type="text" id="ipt_modelo">
    <span>Ano:</span>
    <input type="text" id="ipt_ano">
    <br> <br>
    <button onclick="cadastrarCarro()">Cadastrar Carro</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>

    function cadastrarCarro(){
        let carro = {
            marca: ipt_marca.value,
            modelo: ipt_modelo.value,
            ano: Number(ipt_ano.value)
        };

        carro.idade = 2026 - carro.ano;
        delete carro.ano;

        div_exibir.innerHTML = `
            Marca: ${carro.marca} <br>
            Modelo: ${carro.modelo} <br>
            Idade do carro: ${carro.idade} anos
        `;
    }
</script>

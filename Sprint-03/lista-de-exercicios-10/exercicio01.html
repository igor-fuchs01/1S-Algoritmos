<!-- 1. Cadastro de Pets com Informações Agrupadas
Crie um programa o qual:

a) O usuário informe:

nome do pet;
tipo do animal;
idade;
b) Ao clicar em "Cadastrar Pet", as informações sejam armazenadas em um objeto JSON;

c) Exiba abaixo do botão:

Pet: Rex
Tipo: Cachorro
Idade: 4 anos

d) Mostre também no console.log() o objeto completo do pet.
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Nome do pet:</span>
    <input type="text" id="ipt_nome">
    <span>Tipo do animal:</span>
    <input type="text" id="ipt_tipo">
    <span>Idade:</span>
    <input type="text" id="ipt_idade">
    <br> <br>
    <button onclick="cadastrarPet()">Cadastrar Pet</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>

    function cadastrarPet(){
        let pet = {
            nome: ipt_nome.value,
            tipo: ipt_tipo.value,
            idade: ipt_idade.value
        };

        div_exibir.innerHTML = `
            Pet: ${pet.nome} <br>
            Tipo: ${pet.tipo} <br>
            Idade: ${pet.idade} anos
        `

        console.log(pet);
    }
</script>

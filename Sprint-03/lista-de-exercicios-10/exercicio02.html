<!-- 2. Cadastro de Funcionários com Alteração de Dados
Crie um programa o qual:

a) O usuário informe:

nome do funcionário;
cargo;
salário;
b) Ao clicar em "Cadastrar Funcionário", crie um objeto JSON chamado funcionario;

c) Após criar o objeto:

transforme o nome em letras maiúsculas;
crie um novo atributo chamado bonus;
o bônus será 10% do salário;
d) Exiba:

Funcionário: MARCOS
Cargo: Desenvolvedor
Salário: R$3000
Bônus: R$300
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Nome do funcionário:</span>
    <input type="text" id="ipt_nome">
    <span>Cargo:</span>
    <input type="text" id="ipt_cargo">
    <span>Salário:</span>
    <input type="text" id="ipt_salario">
    <br> <br>
    <button onclick="cadastrarFuncionario()">Cadastrar Funcionário</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>

    function cadastrarFuncionario(){
        let funcionario = {
            nome: ipt_nome.value,
            cargo: ipt_cargo.value,
            salario: Number(ipt_salario.value)
        };

        funcionario.nome = funcionario.nome.toUpperCase();
        funcionario.bonus = funcionario.salario * 0.10;

        div_exibir.innerHTML = `
            Funcionário: ${funcionario.nome} <br>
            Cargo: ${funcionario.cargo} <br>
            Salário: R$${funcionario.salario} <br>
            Bônus: R$${funcionario.bonus.toFixed(2)} 
        `;
    }
</script>

<!-- 
 7. Dividindo a pizza e a caixinha do entregador

Todo mundo gosta de pizza! É um prato super democrático, pois existem sabores veganos, vegetarianos, sem glúten, "low carb" 
(pouco carboidrato), doces etc.   

Crie um programa o qual:  

a) Solicite o sabor e o preço da pizza;  

b) Solicite a quantidade de amigos que vão comer;  

c) Ao clicar num botão "Ver valor por amigo", calcule e exiba na tela uma frase como esta:  

    Cada amigo vai colaborar com R$X para a pizza de Y.  

Obs: inclua no valor da pizza a caixinha do entregador que é sempre 10% do valor da pizza.  

Obs²: Y é o sabor da pizza;  
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 07</title>
  </head>
  <body>
    <span>Insira o sabor da pizza:</span>
    <input type="text" id="input_sabor" />
    <br />

    <span>Insira o valor da pizza:</span>
    <input type="number" id="input_valor" />
    <br />

    <span>Insira a quantidade de amigos:</span>
    <input type="number" id="input_qtd_amigos" />
    <br />

    <button onclick="calcularValorPizza()">Ver valor por amigo</button>
    <div id="div_exibir"></div>
  </body>
</html>
<script>
  function calcularValorPizza() {
    let valorCompra = Number(input_valor.value);
    let qtdAmigos = Number(input_qtd_amigos.value);
    let sabor = input_sabor.value;

    let valorCaixinha = valorCompra * 0.10
    let valorPorAmigo = (valorCaixinha + valorCompra) / qtdAmigos;

    div_exibir.innerHTML = `Cada amigo vai colaborar com R$${valorPorAmigo} para a pizza de ${sabor}.`;
  }
</script>

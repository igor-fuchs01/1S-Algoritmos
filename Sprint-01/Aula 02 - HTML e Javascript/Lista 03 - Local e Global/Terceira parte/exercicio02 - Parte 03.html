<!-- 2.  Depósito e Retirada de dinheiro

Crie um programa que:  

a) Solicite o valor a ser depositado/retirado pelo usuário 

b) Tenha os botões “Depositar” e “Retirar”. Ao clicar em algum deles, exibe uma mensagem com uma das frases abaixo, de acordo com o botão que foi clicado:  

   - Depósito de R$X efetuado! Saldo atual: R$Y 

   - Retirada de R$X efetuada! Saldo atual: R$Y 

OBS: o valor do saldo atual se inicia em 0, para depois ir reduzindo/incrementando de acordo com a operação realizada -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 02</title>
</head>
<body>
    <span>Informe o valor a ser depositado/retirado:</span>
    <input type="text" id="input_deposito_retira">
    <br>
    <button onclick="depositar()">Depositar</button>
    <button onclick="retirar()">Retirar</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let saldo = 0;
    function depositar(){
        let deposito = Number(input_deposito_retira.value);
        saldo += deposito;
        div_exibir.innerHTML = `Depósito de R$${deposito} efetuado! Saldo atual: R$${saldo}`;
    }
    function retirar(){
        let retirada = Number(input_deposito_retira.value);
        saldo -= retirada;
        div_exibir.innerHTML = `Retirada de R$${retirada} efetuada! Saldo atual: R$${saldo}`;
    }
</script>

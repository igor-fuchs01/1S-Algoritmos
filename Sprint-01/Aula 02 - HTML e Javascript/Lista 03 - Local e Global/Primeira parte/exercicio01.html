<!-- 1. Operações Aritméticas, innerHTML e Variáveis
OBS: as mensagens devem utilizar "id_elemento.innerHTML", para exibir na página, não em alertas.
1. Aposentadoria: Quanto Falta?

Crie um programa o qual:  

a) Solicite a idade do usuário  

b) Deve haver 2 botões abaixo: "Aposentadoria Homem" e "Aposentadoria Mulher"  

c) No primeiro botão, calcule e exiba uma mensagem com o tempo que falta para se aposentar caso seja homem, considerando que um homem se aposenta com 70 anos  

d) No segundo botão, calcule e exiba uma mensagem com o tempo que falta para se aposentar caso seja mulher, considerando que uma mulher se aposenta com 60 anos  
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 01</title>
  </head>
  <body>
    <input type="number" id="input_idade" />
    <button onclick="aposentarHomem()">Aposentadoria Homem</button>
    <button onclick="aposentarMulher()">Aposentadoria Mulher</button>
    <br />
    <span id="span_exibir"></span>
  </body>
</html>
<script>
  function aposentarHomem() {
    let idade = Number(input_idade.value);
    let resultado = 70 - idade;
    span_exibir.innerHTML = `Faltam ainda ${resultado} anos para você aposentar.`;
  }
  function aposentarMulher() {
    let idade = Number(input_idade.value);
    let resultado = 60 - idade;
    span_exibir.innerHTML = `Faltam ainda ${resultado} anos para você aposentar.`;
  }
</script>

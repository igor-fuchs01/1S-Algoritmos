<!-- 1. Parte 1 - Introdução
1. Cadastro de Local e Nascimento 
Crie um programa que contenha:

Um campo para inserir a Cidade Natal
Um campo para inserir o Ano de Nascimento
Um botão com o texto "Cadastrar"
Ao clicar no botão, uma caixa de alerta deve exibir a mensagem:
"Você nasceu na cidade de X em Y"
(onde X é a cidade informada e Y o ano de nascimento) -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 01</title>
  </head>
  <body>
    <div>
      <span>Cidade Natal:</span>
      <input type="text" id="input_cidade" placeholder="Ex: Santo André, São Caetano do Sul..." />
      <br />
    </div>
    <div>
      <span>Ano de Nascimento:</span>
      <input type="number" id="input_nascimento" placeholder="Ex: 2004, 1990, 1950..."/>
      <br />
    </div>
    <button onclick="cadastrar()">Cadastrar</button>
  </body>
</html>
<script>
  function cadastrar() {
    alert(
      "Você nasceu na cidade de " +
        input_cidade.value +
        " em " +
        input_nascimento.value,
    );
  }
</script>

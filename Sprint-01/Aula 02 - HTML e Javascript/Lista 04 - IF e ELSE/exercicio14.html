<!-- 
 14. Análise da média de notas 

Crie um programa o qual:  

a) Solicite 2 notas de um aluno  

b) Ao clicar em "Verificar situação", calcule sua média e...  

c) Caso a média seja a partir de 6, exiba um alert com "Parabéns, aprovado!"  

d) Caso a média seja menor que 6, exiba um alert com "Tente outra vez..." 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 14</title>
</head>
<body>
    <h1>Análise da média de notas</h1>
    <span>Insira a nota da primeira prova:</span>
    <input type="text" id="ipt_nota1">
    <br><br>
    <span>Insira a nota da segunda prova:</span>
    <input type="text" id="ipt_nota2">
    <br><br>
    <button onclick="verificarSituacao()">Verificar Situação</button>
    <br><br>
</body>
</html>
<script>
    function verificarSituacao(){
        let nota1 = Number(ipt_nota1.value);
        let nota2 = Number(ipt_nota2.value);
        let media = (nota1 + nota2) / 2

        if(media >= 6){
            alert(`Parabéns, aprovado!`);
        } else {
            alert(`Tente outra vez...`);
        }
    }
</script>

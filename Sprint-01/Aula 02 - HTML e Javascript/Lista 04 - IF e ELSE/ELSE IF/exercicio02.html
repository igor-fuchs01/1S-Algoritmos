<!-- 2. Classe Social em Tuvalu: Em Qual Você se Encaixa?
Crie um programa que exibe a classe social de uma pessoa que mora em Tuvalu (um dos menores países do mundo) conforme a renda familiar mensal. 

a) Solicite a renda familiar mensal 

b) Ao clicar no botão “Analisar Renda”, deve aparecer abaixo uma dessas frases:   

   "Classe E" (até 250) 

   "Classe D" (+250 até 900) 

   "Classe C" (+900 até 2500) 

   "Classe B" (+2500 até 9500) 

   "Classe A" (+9500)  
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 02</title>
</head>
<body>
    <h1>Classe Social em Tuvalu: Em Qual Você se Encaixa?</h1>
    <span>Insira a renda familiar mensal:</span>
    <input type="text" id="ipt_renda">
    <button onclick="analisarRenda()">Analisar Renda</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function analisarRenda(){
        let renda = Number(ipt_renda.value);
        if(renda <= 250){
            div_exibir.innerHTML = "Classe E";
        } else if(renda <= 900){
            div_exibir.innerHTML = "Classe D";
        } else if(renda <= 2500){
            div_exibir.innerHTML = "Classe C";
        } else if(renda <= 9500){
            div_exibir.innerHTML = "Classe B";
        } else {
            div_exibir.innerHTML = "Classe A";
        }
    }
</script>

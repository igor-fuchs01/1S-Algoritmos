<!-- 10 Limite de Velocidade.
Crie um programa que avalie se um motorista ultrapassou o limite de velocidade.

a) Pergunte ao usuário a velocidade que ele estava dirigindo (km/h).
b) Pergunte qual é o limite de velocidade da via (km/h).
c) Ao clicar em "Verificar", exiba uma das mensagens abaixo:

"Velocidade dentro do limite. Boa direção!", caso a velocidade seja menor ou igual ao limite.
"Atenção! Excedendo o limite permitido.", caso a velocidade esteja até 20% acima do limite.
"Multa grave! Velocidade muito acima do permitido.", caso esteja mais de 20% acima do limite.
 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10</title>
</head>
<body>
    <h1>Limite de Velocidade</h1>
    <span>Insira a velocidade que o usuário estava dirigindo(km/h):</span>
    <input type="text" id="ipt_velocidade">
    <br> <br>
    <span>Insira o limite da via(km/h):</span>
    <input type="text" id="ipt_limite">
    <br> <br>
    <button onclick="verificar()">Verificar</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function verificar(){
        let velocidade = Number(ipt_velocidade.value);
        let limite = Number(ipt_limite.value);

        if(velocidade <= limite){
            div_exibir.innerHTML = `Velocidade dentro do limite. Boa direção!`;
        } else if(velocidade <= (limite + limite * 20 / 100)){ // 100 = 100 | x = 20
            div_exibir.innerHTML = `Atenção! Excedendo o limite permitido.`;
        } else {
            div_exibir.innerHTML = `Multa grave! Velocidade muito acima do permitido.`;
        }
    }
</script>

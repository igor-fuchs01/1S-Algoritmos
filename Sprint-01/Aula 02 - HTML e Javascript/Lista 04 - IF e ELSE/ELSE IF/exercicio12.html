<!-- 12. Resto da Divisão por 5
Crie um programa que receba um número maior que zero, se não for maior que zero dê um alerta "Digite um número maior que zero" e não faça mais nada.

Ao clicar no botão "Múltiplo de 5" analise o resto da divisão do número informado por 5 e emita uma das mensagens abaixo:

·         Se o resto for 0 - "Perfeito, esse número é múltiplo de cinco"

·         Se o resto for 1 - "Vich, sobrou um"

·         Se o resto for 2 - "Para esse o resto é dois"

·         Se o resto for 3 - "Com mais dois daria certo"

·         Se o resto for 4 - "Só faltou 1 para ser múltiplo de 5" 
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 12</title>
  </head>
  <body>
    <h1>Resto da Divisão por 5</h1>
    <span>Insira um número: </span>
    <input type="text" id="ipt_num" />
    <br />
    <br />
    <button onclick="multiploCinco()">Múltiplo de 5</button>
    <br />
    <br />
    <div id="div_mensagem"></div>
  </body>
</html>
<script>
  function multiploCinco() {
    let num = Number(ipt_num.value);
    if (num <= 0) {
      alert(`Digite um número maior que zero`);
    } else if ((num % 5) == 0) {
      div_mensagem.innerHTML = "Perfeito, esse número é múltiplo de cinco";
    } else if ((num % 5) == 1) {
      div_mensagem.innerHTML = "Vich, sobrou um";
    } else if ((num % 5) == 2) {
      div_mensagem.innerHTML = "Para esse o resto é dois";
    } else if ((num % 5) == 3) {
      div_mensagem.innerHTML = "Com mais dois daria certo";
    } else {
      div_mensagem.innerHTML = "Só faltou 1 para ser múltiplo de 5";
    }
  }
</script>

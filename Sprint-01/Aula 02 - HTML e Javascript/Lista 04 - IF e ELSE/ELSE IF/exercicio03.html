<!-- 3. Sensação Térmica: Como o Corpo Humano Percebe a Temperatura
Para o ser humano, a temperatura é... 

Congelante (até menos de 14ºC) 

Com Frio (entre 14ºC e 21ºC) 

Confortável (mais de 21ºC até 24ºC) 

Com Calor (mais de 24ºC até 31ºC) 

Calor escaldante (mais de 31ºC) 

Crie um programa que, ao ler uma temperatura, exiba uma dessas situações acima.  
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 03</title>
  </head>
  <body>
    <h1>Sensação Térmica: Como o Corpo Humano Percebe a Temperatura</h1>
    <span>Insira a temperatura do seu corpo (em celsius):</span>
    <input type="text" id="ipt_temperatura" />
    <button onclick="lerTemperatura()">Ler Temperatura</button>
    <div id="div_exibir"></div>
  </body>
</html>
<script>
  function lerTemperatura() {
    let temperatura = Number(ipt_temperatura.value);
    if (temperatura <= 14) {
      div_exibir.innerHTML = "Congelante";
    } else if (temperatura <= 21) {
      div_exibir.innerHTML = "Com Frio";
    } else if (temperatura <= 24) {
      div_exibir.innerHTML = "Confortável";
    } else if (temperatura <= 31) {
      div_exibir.innerHTML = "Com Calor";
    } else {
      div_exibir.innerHTML = "Calor escaldante";
    }
  }
</script>

<!-- 4. Avaliação de Peso Infantil: Está Dentro da Faixa Saudável?
Uma nutróloga deseja um programa que ajude-a no processo de avaliação do peso de crianças de 5 anos.

Seu programa, ao ler o peso da criança, deve exibir uma dessas frases:

Abaixo do peso (se peso até 13.5kg) 

Acima do peso (se peso maior que 21.2kg) 

Peso na média (se peso maior que 13.5kg até 21.2kg) 

Peso perfeito (se o peso for exatamente 18.3kg)  
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 04</title>
</head>
<body>
    <h1>Avaliação de Peso Infantil: Está Dentro da Faixa Saudável?</h1>
    <span>Insira o peso da criança de 5 anos (em KG):</span>
    <input type="text" id="ipt_peso">
    <br> <br>
    <button onclick="checarPeso()">Checar Peso</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function checarPeso(){
        let peso = Number(ipt_peso.value);

        if(peso <= 13.5){
            div_exibir.innerHTML = "Abaixo do peso";
        } else if(peso == 18.3){
            div_exibir.innerHTML = "Peso perfeito";
        } else if(peso <= 21.2){
            div_exibir.innerHTML = "Peso na média";
        } else {
            div_exibir.innerHTML = "Acima do peso";
        }
    }
</script>

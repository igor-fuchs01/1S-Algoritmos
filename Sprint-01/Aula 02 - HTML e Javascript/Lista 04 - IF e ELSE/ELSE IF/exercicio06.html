<!-- 6. Times Paulistas: O Canto da Sua Torcida!
Crie um programa o qual: 
a) Pergunte qual dos seguintes times de São Paulo o usuário torce (São Paulo, Palmeiras, Corinthians, Santos); 
b) Ao clicar em "Fale sobre esse time", exiba abaixo: 

   "Salve o Corinthians" -> com fundo preto e letra branca, se for Corinthians 
   "Salve o alviverde imponente" -> com fundo verde e letra branca, se for Palmeiras 
   "Agora quem dá a bola é o Santos" -> com fundo branco e letra preta, se for Santos 
   "Salve o Tricolor paulista" -> com fundo preto e letra vermelha, se for São Paulo 
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 06</title>
  </head>
  <body>
    <h1>Times Paulistas: O Canto da Sua Torcida!</h1>
    <span
      >Qual dos seguintes times você torce(São Paulo, Palmeiras, Corinthians,
      Santos):</span
    >
    <input id="ipt_time" type="text" />
    <button onclick="falarTime()">Fale sobre esse time</button>
    <br />
    <br />
    <div id="div_exibir"></div>
    
  </body>
</html>
<script>
  function falarTime() {
    let time = ipt_time.value;
    if (time == "Corinthians") {
      div_exibir.innerHTML = `<span style="color: white; background-color: black;">Salve o Corinthians</span>`;
    } else if (time == "Palmeiras") {
      div_exibir.innerHTML = `<span style="color: white; background-color: green;">Salve o alviverde imponente</span>`;
    } else if (time == "Santos") {
      div_exibir.innerHTML = `<span style="color: black; background-color: white;">Agora quem dá a bola é o Santos</span>`;;
    } else if (time == "São Paulo"){
      div_exibir.innerHTML = `<span style="color: red; background-color: black;">Salve o Tricolor paulista</span>`;;
    }
  }
</script>

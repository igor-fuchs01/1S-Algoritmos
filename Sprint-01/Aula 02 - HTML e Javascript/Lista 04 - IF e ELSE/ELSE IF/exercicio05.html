<!-- 5. Classificação de Alunos: Como Está Seu Desempenho?
Crie um programa o qual:

a) Solicite a nota do aluno;

b) Ao clicar em "Classificar aluno", exiba uma dessas mensagens em um alert:

      "Aluno precisa de muita ajuda", caso a nota for menor que 5.
      "Aluno na média", caso a nota for entre 5 até 7.
      "Aluno na acima da média", caso a nota for maior que 7 até 9.5.
      "Aluno fora da curva", caso a nota for maior que 9.5. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 05</title>
</head>
<body>
    <h1>Classificação de Alunos: Como Está Seu Desempenho?</h1>
    <span>Insira a nota do aluno:</span>
    <input type="text" id="ipt_aluno">
    <button onclick="classificarAluno()">Classificar Aluno</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function classificarAluno(){
        let aluno = Number(ipt_aluno.value);
        if(aluno < 5){
            div_exibir.innerHTML = "Aluno precisa de muita ajuda";
        } else if(aluno <= 7){
            div_exibir.innerHTML = "Aluno na média";
        } else if(aluno <= 9.5){
            div_exibir.innerHTML = "Aluno na acima da média";
        } else {
            div_exibir.innerHTML = "Aluno fora da curva";
        }
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03</title>
</head>
<body>
    <h1>Relembrando Moradias: Onde Você Já Viveu</h1>
    <span>Insira o bairro aonde você morou: </span>
    <input type="text" id="ipt_bairro">
    <button onclick="cadastrarBairro()">Cadastrar Bairro</button>
    <br> <br>
    <span>Insira o número do bairro que você morou (1, 2, 3, ...): </span>
    <input type="text" id="ipt_relembrar">
    <button onclick="relembrarMoradia()">Relembrar moradia</button>
    <br> <br>
    <div id="div_exibir"></div>

</body>
</html>
<script>
    let listaMoradia = [];

    function cadastrarBairro(){
        let nomeBairro = ipt_bairro.value;

        listaMoradia.push(nomeBairro);

        div_exibir.innerHTML = `O bairro ${nomeBairro} foi cadastrado!`
    }

    function relembrarMoradia(){
        let relembrarMoradia = Number(ipt_relembrar.value);

        if(relembrarMoradia > listaMoradia.length || relembrarMoradia <= 0){
            div_exibir.innerHTML = `Você ainda não morou num ${relembrarMoradia}º bairro!`;
        } else {
            div_exibir.innerHTML = `O ${relembrarMoradia}º bairro que você morou tinha o nome de ${listaMoradia[relembrarMoradia - 1]}`;
        }
    }
</script>

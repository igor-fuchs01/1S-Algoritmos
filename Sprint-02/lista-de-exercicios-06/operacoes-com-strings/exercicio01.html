1. Contador de Caracteres

Crie um programa que:  

a) Solicite uma frase ao usuário.  

b) Ao clicar num botão "Analisar Frase":  

   b1) Exiba "Tamanho da Frase: 99", sendo 99 a quantidade de caracteres na frase. 

   b2) Caso a frase possua menos de 10 caracteres, exiba "Frase Curta!" em vermelho, abaixo da frase anterior. 

   b3) Caso contrário, exiba "Frase longa!" em azul.

OBS: utilize .length para obter a quantidade de caracteres de uma string (texto) 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01</title>
</head>
<body>
    <h1>Contador de Caracteres</h1>
    <span>Insira uma frase:</span>
    <input type="text" id="ipt_frase">
    <br> <br>
    <button onclick="analisarFrase()">Analisar Frase</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function analisarFrase(){
        let frase = ipt_frase.value;
        
        div_exibir.innerHTML = `Tamanho da Frase: ${frase.length}`;

        if(frase.length < 10){
            div_exibir.innerHTML += `<br> Frase Curta!`;
        } else {
            div_exibir.innerHTML += `<br> Frase longa!`;
        }
    }
</script>

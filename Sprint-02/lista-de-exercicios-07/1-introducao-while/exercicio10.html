<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10</title>
</head>
<body>
    <span>Insira o usuário um número:</span>
    <input type="text" id="ipt_numero">
    <button onclick="checarPares()">S2 Pares</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function checarPares(){
        let numero = Number(ipt_numero.value);
        let contador = 0;

        while(contador <= numero){
            if(contador % 2 == 0){
                div_exibir.innerHTML += `${contador++} <br>`;
            }
            contador++;
        }
    }
</script>

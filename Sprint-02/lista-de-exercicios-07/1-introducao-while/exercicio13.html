<!--  
13. Papagaio Falante
Crie um programa o qual:

a) Pergunte ao usuário um número  

b) Pergunte ao usuário uma frase  

c) Ao clicar num botão "Papagaio", a frase é exibida N vezes em N alerts, onde N é o número informado em a)

OBS: ao digitar "oi" e "2", devem aparecer 2 alertas, escritos "oi oi"

OBS2: é recomendado utilizar a tecla "enter" para fechar o alerta ao invés de clicar com o mouse, pois cliques sucessivos em alertas podem gerar bugs.  
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 12</title>
</head>
<body>
    <span>Insira um número: </span>
    <input type="text" id="ipt_numero">
    <br> <br>
    <span>Insira uma frase: </span>
    <input type="text" id="ipt_frase">
    <br> <br>
    <button onclick="papagaiar()">Papagaio Repetitivo</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function papagaiar(){
        let numero = Number(ipt_numero.value);
        let frase = ipt_frase.value;
        let contador = 0;

        while(contador < numero){
            contador++;
            frase += ipt_frase.value;
        } 

        contador = 1;

        while(contador < numero){
            contador++;
            alert(frase);
        } 
    }
</script>

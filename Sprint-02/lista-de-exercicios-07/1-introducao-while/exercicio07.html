<!-- 7. S2 Pares
Crie um programa o qual:
 
a) Ao clicar num botão "S2 Pares"...  

b) Exiba, debaixo do botão, todos os números pares de 0 a 100, um embaixo do outro.

OBS: ao percorrer os números de 0 a 100, como validamos se o número atual é par, para ser exibido?   -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 07</title>
</head>
<body>
    <button onclick="checarPares()">S2 Pares</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function checarPares(){
        let contador = 0;

        while(contador <= 100){
            if(contador % 2 == 0){
                div_exibir.innerHTML += `${contador++} <br>`;
            }
            contador++;
        }
    }
</script>

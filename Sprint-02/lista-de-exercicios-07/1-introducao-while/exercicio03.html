<!-- 3. Frase Numerada
Refaça o programa anterior de tal forma que, antes de cada frase apareça um contador.
Ex: Se a frase digitada foi “Boa Tarde” a página ficará assim:   

   1. Boa tarde   

   2. Boa tarde   

   ...   

   7. Boa tarde   -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03</title>
</head>
<body>
    <h1>Frase Repetitiva</h1>
    <button onclick="falarSobreAlgoritmos()">Diga algo sobre a matéria de Algoritmos</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let contador = 1;
    function falarSobreAlgoritmos(){
        while(contador <= 7){
            div_exibir.innerHTML += `${contador++}. Essa matéria é top! <br>`
        }
    }
</script>

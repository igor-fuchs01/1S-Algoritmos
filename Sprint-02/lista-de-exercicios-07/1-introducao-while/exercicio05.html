<!-- 5. Corrida de Voltas
Crie um programa o qual:

a) Pergunte ao usuário quantas voltas um carro dará numa corrida   

b) Ao clicar num botão "Iniciar corrida!"...   

c) Até que o carro termine a corrida, exiba, debaixo do botão, frases como estas:   

       Carro dando a 1ª volta   

       Carro dando a 2ª volta   

       Carro dando a 3ª volta

       ...   (até a última volta informada pelo usuário)

d) Ao atingir o número de voltas informado, exiba, abaixo de tudo, a frase "Corrida finalizada!".

OBS: ao 'finalizar' as repetições das voltas, após o while, deve aparecer a mensagem.  
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 05</title>
</head>
<body>
    <h1>Corrida de Voltas</h1>
    <span>Quantas voltas seu carro dará na corrida: </span>
    <input type="text" id="ipt_qntd">
    <br> <br>
    <button onclick="iniciarCorrida()">Iniciar corrida!</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function iniciarCorrida(){
        let contador = 1;
        let qntd = Number(ipt_qntd.value);
        div_exibir.innerHTML = ``;

        while(contador <= qntd){
            div_exibir.innerHTML += `Carro dando a ${contador}ª volta <br>`
            contador++;
        }

        div_exibir.innerHTML += `Corrida finalizada!`;
    }
</script>

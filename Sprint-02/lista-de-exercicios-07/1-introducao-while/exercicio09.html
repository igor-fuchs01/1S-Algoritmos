<!-- 9. Viva o 7!
Crie um programa o qual:

a) Receba um número (tem que estar entre 0 e 200);  

b) Ter um botão chamado "Viva o 7!"   

c) Ao clicar nesse botão, devem aparecer todos os múltiplos de 7 entre 0 e o número informado em a) 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 09</title>
</head>
<body>
    <h1>Viva o 7!</h1>
    <span>Insira o usuário um número(0 e 200):</span>
    <input type="text" id="ipt_numero">
    <button onclick="vivaSete()">Viva o 7!</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function vivaSete(){
        let contador = 0;
        let numero = Number(ipt_numero.value);
        div_exibir.innerHTML = ``;

        while(contador <= numero && numero >= 0 && numero <= 200){
            if(contador % 7 == 0){
                div_exibir.innerHTML += `${contador} <br>`;
            }
            contador++;
        }
    }
</script>

<!-- 11. Tabuada Colorida
Crie um programa o qual:

a) Pergunte, numa input ou lista suspensa (select/option), qual a tabuada que o usuário quer ver na tela (2 a 9);  

b) Pergunte até que número a tabuada deve ser construída;  

c) Ao clicar no botão “Ver Tabuada”, exiba abaixo a tabuada como neste exemplo (considerando que o usuário escolheu a tabuada do 3 e para ir até o 12).  

    3 x 1 = 3   

    3 x 2 = 6   

    3 x 3 = 9   

    3 x 4 = 12   

    3 x 5 = 15   

    3 x 6 = 18   

    3 x 7 = 21   

    3 x 8 = 24   

    3 x 9 = 27   

    3 x 10 = 30   

    3 x 11 = 33   

    3 x 12 = 36   

d) Observar que quando o multiplicador for ímpar, a linha deve aparecer na cor vermelha e quando for par, na cor azul.

Ex: "3 x 1 = 3" aparecer em vermelho, mas "3 x 4 = 12" aparece em azul.   
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 11</title>
</head>
<body>
    <span>Selecione a tabuada que você quer ver:</span>
    <select id="select_tabuada">
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
    </select>
    <br> 
    <span>Informe o número que a tabuada deve seguir:</span>
    <input type="text" id="ipt_numero">
    <button onclick="verTabuada()">Ver Tabuada</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function verTabuada(){
        let contador = 1;
        let tabuada = Number(select_tabuada.value);
        let numero = Number(ipt_numero.value) 
        while(contador <= numero){
            div_exibir.innerHTML += `${tabuada} x ${contador} = ${tabuada * contador} <br>`;
            contador++;
        }
    }
</script>

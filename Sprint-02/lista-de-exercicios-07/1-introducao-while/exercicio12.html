<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 12</title>
</head>
<body>
    <span>Insira um número: </span>
    <input type="text" id="ipt_numero">
    <br> <br>
    <span>Insira uma frase: </span>
    <input type="text" id="ipt_frase">
    <br> <br>
    <button onclick="papagaiar()">Papagaio Repetitivo</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function papagaiar(){
        let numero = Number(ipt_numero.value);
        let frase = ipt_frase.value;
        let contador = 0;

        while(contador < numero){
            contador++;
            div_exibir.innerHTML += `${contador} - ${frase} <br>`;
            frase += ipt_frase.value;
        } 
    }
</script>

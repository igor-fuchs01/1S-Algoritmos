<!-- 2. Frase Repetitiva
Crie um programa o qual: 
 
a) Tenha um botão "Diga algo sobre a matéria de Algoritmos";  

b) Ao clicar nele, mostre na própria página 7 vezes uma frase a sua escolha, uma abaixo da outra.

OBS:  sem input, sugiro criar uma variável para com uma mensagem fixa.  
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 02</title>
</head>
<body>
    <h1>Frase Repetitiva</h1>
    <button onclick="falarSobreAlgoritmos()">Diga algo sobre a matéria de Algoritmos</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let contador = 0;
    function falarSobreAlgoritmos(){
        while(contador < 7){
            div_exibir.innerHTML += `Essa matéria é top! <br>`
            contador++;
        }
    }
</script>

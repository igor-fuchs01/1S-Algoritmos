<!-- 4. Expressar amor
Crie um programa o qual:

a) Pergunte o nome da pessoa que o usuário mais ama na vida

b) Pergunte o quanto o usuário a ama (um número inteiro)

c) Ao clicar num botão "Expressar amor", devem aparecer, abaixo dele, N vezes (conforme o valor em b)) a frase indicada em a), como neste exemplo (considerando o nome "Lady Gaga" e que ama "3")   

      1 - Lady Gaga, eu te amo! Sempre lembre disso!   

      2 - Lady Gaga, eu te amo! Sempre lembre disso!   

      3 - Lady Gaga, eu te amo! Sempre lembre disso!    -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 04</title>
</head>
<body>
    <span>Qual o nome da pessoa que você ama nessa vida:</span>
    <input type="text" id="ipt_amor">
    <br> <br>
    <span>Quanto você ama:</span>
    <input type="text" id="ipt_quanto">
    <br> <br>
    <button onclick="expressarAmor()">Expressar amor</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function expressarAmor(){
        let contador = 1;
        let quem = ipt_amor.value;
        let quanto = Number(ipt_quanto.value);
        div_exibir.innerHTML = '';

        while(contador <= quanto){
            div_exibir.innerHTML += `${contador++}. ${quem}, eu te amo! Sempre lembre disso! <br>`
        }
    }
</script>

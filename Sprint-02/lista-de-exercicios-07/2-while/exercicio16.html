<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 16</title>
</head>
<body>
    <span>Quantos em quantos dias você faz musculação:</span>
    <input type="text" id="ipt_dias_musculacao">
    <button onclick="exibirRotinaMensal()">Exibir rotina mensal</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function exibirRotinaMensal(){
        let diasMusculacao = Number(ipt_dias_musculacao.value);
        let contador = 1;
        let mensagem = '';

        while (contador <= 30){
            if(contador % diasMusculacao == 1){
                mensagem += `Dia ${contador} - Musculação <BR>`;
            } else {
                mensagem += `Dia ${contador} - Comer, dormir etc <BR>` 
            }
            contador++;
        }
        div_exibir.innerHTML = mensagem;
    }
</script>

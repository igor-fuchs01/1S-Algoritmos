<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 18</title>
</head>
<body>
    <h1>Divisores</h1>
    <span>Insira um número de 0 a 100: </span>
    <input type="text" id="ipt_num">
    <br> <br>
    <button onclick="verDivisores()">Ver Divisores</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function verDivisores(){
        let mensagem = '';
        let contador = 0;
        let numero = Number(ipt_num.value);

        mensagem += `Divisores do Número ${numero}: <br>`; 

        while(contador <= numero){
            if(numero % contador == 0){
                mensagem += `${contador}<br>`;
            }
            contador++;
        }

        div_exibir.innerHTML = mensagem;
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 20</title>
</head>
<body>
    <h1>Soma dos Pares</h1>
    <span>Insira um número entre 10 e 500: </span>
    <input type="text" id="ipt_num">
    <button onclick="somarPares()">Somar Pares</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function somarPares(){
        let num = Number(ipt_num.value);
        let mensagem = '';
        let contador = 1;
        let numAux = 0;

        if(num < 10 && num > 500){
            alert("Coloque um número entre 10 e 500.");
        } else {
            while(contador <= num){
                if(contador % 2 == 0){
                    mensagem += `${contador}<br>`;
                    numAux += contador;
                    console.log(numAux, num)
                }
                contador++;
            }      
        }

        mensagem += `Soma dos pares: ${numAux}`;
        div_exibir.innerHTML = mensagem;
    }
</script>

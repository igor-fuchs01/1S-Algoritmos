<!-- 5. Avaliação do Clima: Está Agradável ou Desconfortável?
Crie um programa em que ajude a avaliar o clima de um ambiente, o qual: 

a) Solicite a temperatura 

b) Solicite a umidade do ar 

c) Ao clicar em 'Avaliar clima': 

      c.1) Caso a umidade for inválida, ou seja, menor que 0 ou maior que 100, exiba um alert "Valor de umidade inválido" e limpe qualquer outro texto que exista na tela (item c.2) 
      c.2) Caso a umidade for válida, exiba uma dessas frases na própria página, abaixo do botão: 

            "Clima agradável", caso a temperatura for entre 22 e 23 e a umidade for menor que 60. 
            "Clima desconfortável", em caso contrário.   
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 05</title>
</head>
<body>
    <h1>Avaliação do Clima: Está Agradável ou Desconfortável?</h1>
    <span>Inisira a temperatura:</span>
    <input type="text" id="ipt_temp">
    <br> <br>
    <span>Insira a umidade do ar:</span>
    <input type="text" id="ipt_umidade">
    <br> <br>
    <button onclick="avaliarClima()">Avaliar Clima</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function avaliarClima(){
        let temp = ipt_temp.value;
        let umidade = ipt_umidade.value;

        if(umidade < 0 || umidade > 100){
            alert('Valor de umidade inválido');
            div_exibir.innerHTML = '';
        } else if(temp >= 22 && temp <= 23 && umidade < 60){
            div_exibir.innerHTML = "Clima agradável";
        } else {
            div_exibir.innerHTML = "Clima desconfortável";
        }
    }
</script>

<!-- 3. Simulador de Preço do Bilhete Único de São Paulo
Crie um pequeno simulador de preço de passagem de Bilhete Único de São Paulo num programa, o qual: 

a) Tenha uma caixa de seleção para indicar o tipo de passageiro, com os itens 

            Comum 
            Estudante 
            Idoso/PNE 

b) Tenha uma outra caixa de seleção, para indicar o tipo de passagem, com os itens 

            Passagem única 
            Passagem integração 

c) Ao clicar num botão "Simular preço", considere que o preço unitário de uma passagem única é R$4,40 e que a integração é R$5,90 para fazer os cálculos necessários para exibir uma frase como esta: 

            Valor da passagem escolhida: R$X,XX 

d) Considere ainda que um estudante tem 50% de desconto e idoso/PNE possuem gratuidade em qualquer tipo de passagem  
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03</title>
</head>
<body>
    <h1>Simulador de Preço do Bilhete Único de São Paulo</h1>
    <select name="" id="select_tipo_passageiro">
        <option>Comum</option>
        <option>Estudante</option>
        <option>Idoso/PNE</option>
    </select>
    <select name="" id="select_tipo_passagem">
        <option value="4.40">Passagem única</option>
        <option value="5.90">Passagem integração</option>
    </select>
    <button onclick="simularPreco()">Simular preço</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function simularPreco(){
        let tipoPassageiro = select_tipo_passageiro.value;
        let valorPassagem = Number(select_tipo_passagem.value);

        if(tipoPassageiro == 'Estudante'){
            div_exibir.innerHTML = `Valor da passagem escolhida: R$${(valorPassagem / 2).toFixed(2)} <br>`;
        } else if(tipoPassageiro == 'Idoso/PNE'){
            div_exibir.innerHTML = `Valor da passagem escolhida: R$0.00 <br>`;
        } else {
            div_exibir.innerHTML = `Valor da passagem escolhida: R$${valorPassagem.toFixed(2)} <br>`;
        }
    }
</script>

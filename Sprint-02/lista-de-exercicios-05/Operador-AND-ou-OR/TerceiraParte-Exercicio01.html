<!-- 1. Sistema de Avaliação de Atendimento: Dê Sua Nota! 
Crie um pequeno sistema de avaliação de atendimento, o qual: 

a) Pergunte a nota para o atendimento 

b) Ao clicar num botão "Avaliar atendimento", pode uma dessas frases abaixo do botão: 

    b.1) "Nota inválida", caso a nota não esteja entre 0 e 10 

    b.2) "Não aprovado", caso a nota for entre 0 e menor que 5 

    b.3) "Neutro", caso a nota for entre 5 e 6 

    b.4) "Aprovado", caso a nota for mais que 6  
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01</title>
</head>
<body>
    <h1>Sistema de Avaliação de Atendimento: Dê Sua Nota!</h1>
    <span>Insira a nota do atendimento:</span>
    <input type="text" id="ipt_atendimento">
    <button onclick="avaliarAtendimento()">Avaliar atendimento</button>
    <br><br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function avaliarAtendimento(){
        let nota = Number(ipt_atendimento.value);

        if(nota < 0 || nota > 10){
            div_exibir.innerHTML = 'Nota inválida';
        } else if(nota < 5){
            div_exibir.innerHTML = 'Não aprovado';
        } else if(nota <= 6){
            div_exibir.innerHTML = 'Neutro';
        } else {
            div_exibir.innerHTML = 'Aprovado';
        }
    }
</script>

<!-- 
7. Autenticação Segura com Tentativas Limitadas
Melhore o exercício 4, de tal forma que: 

a) Sempre que ocorrer uma falha na autenticação, deve aparecer abaixo da frase de "Falha de autenticação" uma outra frase, como esta: 

            Você ainda tem 2 tentativa(s) 

b) A ideia é que o usuário tem 3 tentativas de autenticação. Sempre que errar novamente na autenticação, o "contador" de tentativas reduz em 1 na tela. 

c) Uma vez que se esgotarem as tentativas, deve surgir mais uma frase abaixo, que seria 

     Usuário BLOQUEADO! Procure seu gerente! 

d) Em caso de usuário bloqueado, não adianta nem tentar fazer uma autenticação com as credenciais corretas, que nada mais acontecerá 

e) Caso o usuário autentique com sucesso, sem que tenham sido queimadas as 3 tentativas, a mensagem de autenticação aparece normalmente e a frase com a quantidade de tentativas deve sumir da tela e deve ser "reiniciada" para as próximas falhas. 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 07</title>
</head>
<body>
    <h1>Autenticação Segura: Acesso ao Banco Melete</h1>

    <span>Insira o login:</span>
    <input type="text" id="ipt_login">
    <br> <br>
    <span>Senha:</span>
    <input type="password" id="ipt_senha">
    <br> <br>
    <span>Informação pessoal:</span>
    <input type="text" id="ipt_informacao_pessoal">
    <br> <br>
    <button onclick="autenticar()">Autenticar</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let tentativas = 3;

    function autenticar(){
        // Tentativas diferentes de zero
        if(tentativas != 0){
            let login = ipt_login.value;
            let senha = ipt_senha.value;
            let informacao_pessoal = ipt_informacao_pessoal.value;

            // Valida as credenciais
            if(login == 'ana' && senha == 'braga' && (informacao_pessoal == '1949' || informacao_pessoal == 'louro josé')){
                div_exibir.innerHTML = `Usuário autenticado`;
                tentativas = 3; // Retorna o número de tentativas
            } else {
                // Reduz as tentativas
                tentativas--;

                // Valida se existe tentativas restantes
                if(tentativas == 0){
                    div_exibir.innerHTML = 'Usuário BLOQUEADO! Procure seu gerente!';
                } else {
                    div_exibir.innerHTML = `Falha na autenticação! <br> Você ainda tem ${tentativas} tentativa(s)!`;
                }
            }
        }
        
    }
</script>

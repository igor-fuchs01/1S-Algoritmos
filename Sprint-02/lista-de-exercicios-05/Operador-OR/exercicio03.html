<!-- 3. Auxílio Emergencial Covid-19
Crie um programa o qual ajudará o governo a saber se ele dará a ajuda emergencial ao Covid19 a um cidadão:  

a) Solicite o valor da renda individual do usuário  

b) Solicite o valor da renda familiar do usuário  

c) Ao clicar em "Terei o benefício", podem aparecer as seguintes mensagens:  

   "Você terá direito ao auxílio", caso renda individual for até 2000 ou caso a renda familiar for até 3000 

   "Sem direito ao auxílio", caso contrário -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 03</title>
  </head>
  <body>
    <h1>Auxílio Emergencial Covid-19</h1>
    <span>Insira o valor da sua renda individual: </span>
    <input type="text" id="ipt_renda_individual" />
    <br />
    <br />
    <span>Insira o valor da sua renda familiar: </span>
    <input type="text" id="ipt_renda_familiar" />
    <br />
    <br />
    <button onclick="beneficio()">Terei o benefício</button>
  </body>
</html>
<script>
  function beneficio() {
    let rendaIndividual = Number(ipt_renda_individual.value);
    let rendaFamiliar = Number(ipt_renda_familiar.value);

    if (rendaIndividual > 2000 || rendaFamiliar > 3000) {
      alert("Sem direito ao auxílio");
    } else {
      alert("Você terá direito ao auxílio");
    }
  }
</script>

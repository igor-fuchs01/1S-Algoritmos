<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    Idade:
    <input type="text" id="input_idade" />
    Possuí título?
    <select id="select_titulo">
      <option>Sim</option>
      <option>Não</option>
    </select>

    <button onclick="verificar()">Verificar Voto</button>
    <div id="div_mensagem"></div>
  </body>
</html>
<script>
  function verificar() {
    let idade = Number(input_idade.value);
    let tituloEleitor = select_titulo.value;

    if (!(idade >= 18 && tituloEleitor == "Sim")) {
      div_mensagem.innerHTML = "Você não pode votar!";
    } else {
      div_mensagem.innerHTML = "Você pode votar!";
    }
  }
</script>

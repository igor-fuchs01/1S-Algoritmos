<!-- 6. Eleição

Crie um programa o qual:  

a) Solicite a quantidade de votos que o "Candidato A" teve na eleição  

b) Solicite a quantidade de votos que o "Candidato B" teve na eleição  

c) Solicite a quantidade de votos brancos que houve na eleição  

d) Solicite a quantidade de votos nulos que houve na eleição  

e) Ao clicar em "Resultado da Eleição", exibir textos conforme o exemplo abaixo:  

    Total de votos: 200  

    Candidato A: 40% (80 votos)  

    Candidato B: 35% (70 votos)  

    Inválidos: 25% (50 votos)  

A quantidade de votos "Inválidos" é a soma de brancos e nulos - valores colhidos nos itens c) e d) -  

Não se preocupe em mostrar primeiro o "vencedor". Não temos como saber isso com o que aprendemos na programação até aqui ;)   

Mostre os candidatos na ordem que quiser.   -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 06</title>
  </head>
  <body>
    <span>Insira a quantidade de votos do 'Candidato A':</span>
    <input type="number" id="input_candidatoA" />
    <br />

    <span>Insira a quantidade de votos do 'Candidato B':</span>
    <input type="number" id="input_candidatoB" />
    <br />

    <span>Insira a quantidade de votos brancos:</span>
    <input type="number" id="input_branco" />
    <br />

    <span>Insira a quantidade de votos do nulos:</span>
    <input type="number" id="input_nulo" />
    <br />

    <button onclick="resultadoEleicao()">Resultado da Eleição</button>

    <div id="div_total"></div>
    <div id="div_candidatoA"></div>
    <div id="div_candidatoB"></div>
    <div id="div_invalidos"></div>
  </body>
</html>
<script>
  function resultadoEleicao() {
    let candidatoA = Number(input_candidatoA.value);
    let candidatoB = Number(input_candidatoB.value);
    let invalidos = Number(input_branco.value) + Number(input_nulo.value);

    let votos = candidatoA + candidatoB + invalidos;
    let porcentagemA = (candidatoA / votos) * 100;
    let porcentagemB = (candidatoB / votos) * 100;
    let porcentagemInvalidos = (invalidos / votos) * 100;

    div_total.innerHTML = `Total de votos: ${votos}`;
    div_candidatoA.innerHTML = `Candidato A: ${porcentagemA}% (${candidatoA} Votos)`;
    div_candidatoB.innerHTML = `Candidato B: ${porcentagemB}% (${candidatoB} Votos)`;
    div_invalidos.innerHTML = `Inválidos: ${porcentagemInvalidos}% (${invalidos} Votos)`;
  }
</script>

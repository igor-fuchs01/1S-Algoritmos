<!-- 1. Altura e Esportes: Descubra Sua Vantagem Competitiva
Crie um programa no qual um profissional de educação física possa determinar de forma mais rápida quais esportes uma pessoa tem uma boa altura para praticar. 

a) Solicite a altura do usuário;

b) Ao clicar em "Analisar Estatura", deve aparecer abaixo uma dessas frases: 

   "Você pode ser piloto de corrida" (altura até 1.65) 

   "Você pode ser jogador de futebol" (altura +1.65 até 1.80) 

   "Você pode ser jogador de vôlei ou basquete" (altura + 1.80) 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01</title>
</head>
<body>
    <h1>Altura e Esportes: Descubra Sua Vantagem Competitiva</h1>
    <span>Insira a sua altura (em metros): </span>
    <input type="text" id="ipt_altura">
    <br> <br>
    <button onclick="analisarEstrutura()">Analisar Estrutura</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function analisarEstrutura(){
        let altura = Number(ipt_altura.value);
        if(altura <= 1.65){
            div_exibir.innerHTML = "Você pode ser piloto de corrida";
        } else if(altura <= 1.8){
            div_exibir.innerHTML = "Você pode ser jogador de futebol";
        } else {
            div_exibir.innerHTML = "Você pode ser jogador de vôlei ou basquete";
        }
    }
</script>

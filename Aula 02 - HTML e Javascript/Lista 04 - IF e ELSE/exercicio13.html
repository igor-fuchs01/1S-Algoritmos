<!-- 13. Análise da c/c (Conta Corrente)

Criar um programa que auxilie o Banco XPTO a identificar quem entrou no cheque especial. 

a) Solicite o saldo da conta 

b) Solicite o valor do débito (ou seja, valor a tirar da conta) 

c) Ao clicar em "Analisar conta", calcule o novo saldo da conta e exiba a mensagem "o saldo atual da conta corrente é "XX". 
Esta frase deverá estar em negrito e em vermelho somente se o saldo for menor que zero ou em itálico e azul caso o saldo for 0 ou mais. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 13</title>
</head>
<body>
    <h1>Análise da c/c (Conta Corrente) do Banco XPTO</h1>
    <span>Insira o saldo da conta do indivíduo:</span>
    <input type="text" id="ipt_saldo">
    <br><br>
    <span>Insira o valor débito:</span>
    <input type="text" id="ipt_debito">
    <br><br>
    <button onclick="analisarConta()">Analisar Conta</button>
    <br><br>
    <div id="div_exibir"></div>
    
</body>
</html>
<script>
    function analisarConta(){
        let saldo = Number(ipt_saldo.value);
        let debito = Number(ipt_debito.value);

        saldo = saldo - debito;
        let mensagem = `o saldo atual da conta corrente é ${saldo}`
        if(saldo < 0){
            div_exibir.innerHTML = `<b style="color: red;">${mensagem}</b>`;
        } else {
            div_exibir.innerHTML = `<b style="color: blue;">${mensagem}</b>`;
        }
        
    }
</script>

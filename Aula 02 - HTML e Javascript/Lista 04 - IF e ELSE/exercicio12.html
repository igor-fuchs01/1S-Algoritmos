<!-- 12. Verificação das finanças 

Crie um programa que faça:  

a) Pergunte ao usuário o valor de seu saldo na conta do banco 

b) Ao clicar no botão "Verificar finanças": 

    b1) Caso o saldo em conta for igual a zero (==0), exiba esta frase na cor preta na tela: "Conta zerada".  

    b2) Caso o saldo seja negativo (<0), exiba esta frase na cor vermelha na tela: "Está devendo!".   

    b3) Caso o saldo seja positivo (>0), exiba esta frase na cor azul: "Saldo positivo! sorriso"   
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 11</title>
</head>
<body>
    <h1>Verificação das finanças</h1>
    <span>Insira o valor do saldo na conta:</span>
    <input type="text" id="ipt_saldo">
    <br><br>
    <button onclick="verificarFinancas()">Verificar finanças</button>
    <br><br>
    <div id="div_exibir"></div>
    
</body>
</html>
<script>
    function verificarFinancas(){
        let saldo = Number(ipt_saldo.value);
        if(saldo == 0){
            div_exibir.innerHTML = `Conta zerada`;
        }
        if(saldo < 0){
            div_exibir.innerHTML = `<span style="color: red">Está devendo!</span>`;
        }
        if(saldo > 0){
            div_exibir.innerHTML = `<span style="color: blue">Saldo positivo! sorriso</span>`;
        }
    }
</script>

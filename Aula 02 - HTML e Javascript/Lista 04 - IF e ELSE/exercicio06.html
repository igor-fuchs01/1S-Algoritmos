<!--6. Conta de luz

Na cidade de Algoritmolândia a luz custa R$ 0,85 por KWh. Crie um programa que:  

a) Solicite a quantidade de KWh consumida no mês 

b) Ao clicar em "Calcular conta de luz", calcule o valor da conta no mês 

c) Dê um desconto de 10% somente se a quantidade for menor que 100 KWh 

d) Exiba um alert com o valor da conta a ser paga. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 06</title>
  </head>
  <body>
    <h1>Conta de luz</h1>
    <span>Insira a quantidade KWh consumida no mês:</span>
    <input type="text" id="input_consumo" />
    <button onclick="calcular()">Calcular conta de luz</button>
    <div id="div_exibir"></div>
  </body>
</html>
<script>
  function calcular() {
    let consumo = Number(input_consumo.value);
    let total = consumo * 0.85;

    if (consumo < 100) {
      total = total - total * 0.1;
    }
    alert(`O valor total a ser pago é de R$${total}`);
  }
</script>

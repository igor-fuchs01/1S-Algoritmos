<!--8. Cheque especial 

Criar um programa que auxilie o Banco XPTO a identificar quem entrou no cheque especial.  

a) Solicite o saldo da conta 

b) Solicite o valor do débito (ou seja, valor a tirar da conta) 

c) Ao clicar em "Analisar conta", calcule o novo saldo da conta e exiba a mensagem "O saldo atual da conta corrente é XX". Esta frase deverá estar em negrito e vermelho somente se o saldo for menor que zero.-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 08</title>
  </head>
  <body>
    <h1>Cheque especial</h1>
    <span>Insira o saldo da conta:</span>
    <input type="text" id="input_saldo" /> <br />
    <br />
    <span>Insira o valor a ser debitado:</span>
    <input type="text" id="input_debito" /> <br />
    <br />
    <button onclick="AnalisarConta()">Analisar conta</button>
    <div id="div_exibir"></div>
  </body>
</html>
<script>
  function AnalisarConta() {
    let saldo = Number(input_saldo.value);
    let deposito = Number(input_debito.value);

    if (saldo < deposito) {
      div_exibir.innerHTML = `<b style="color: red";>O saldo atual da conta corrente é ${saldo - deposito}<b>`;
    } else {
      div_exibir.innerHTML = `O saldo atual da conta corrente é ${saldo - deposito}`;
    }
  }
</script>

<!-- 2. Calculadora de Peso e Altura 
Crie uma página que solicite ao usuário:

Um campo para inserir o Peso
Um campo para inserir a Altura
Um botão com o texto "Fale comigo"
Ao clicar no botão, uma caixa de alerta deve exibir a mensagem:
"Você pesa X kg e tem Y m de altura"
(onde X e Y são os valores digitados pelo usuário) -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 02</title>
  </head>
  <body>
    <div>
      <span>Insira o seu peso (kg):</span>
      <input id="input_peso" type="number" placeholder="Ex: 98, 72, 55..."/>
      <br />
    </div>
    <div>
      <span>Insira a sua altura (m):</span>
      <input id="input_altura" type="number" placeholder="Ex: 1.50, 1.65, 1.95"/>
      <br />
    </div>
    <button onclick="fale_comigo()">Fale comigo</button>
  </body>
</html>

<script>
    function fale_comigo(){
        alert('Você pesa ' + input_peso.value + ' kg e tem ' + input_altura.value + ' m de altura');
    }
</script>

<!-- Crie uma página que solicite ao usuário:

Um campo para inserir o Nome do Time
Um campo para inserir a Quantidade de Títulos que o clube possui
Um botão com o texto "Amo meu time"
Ao clicar no botão, uma caixa de alerta deve exibir a mensagem:
"O time X tem Y títulos"
(onde X é o nome do time e Y é a quantidade de títulos informada)
 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03</title>
</head>
<body>
    <div>
        <span>Nome do time:</span>
        <input type="text" id="input_nome_do_time" placeholder="Ex: Palmeiras, Corinthians, Flamengo, Vasco...">
        <br/>
    </div>
    <div>
        <span>Quantidade de títulos desse time:</span>
        <input type="number" id="input_qtd_titulo" placeholder="Ex: 10, 12, 15, 20...">
        <br/>
    </div>
    <button onclick="qtdTime()">Amo meu time</button>
</body>
</html>
<script>
    function qtdTime(){
        alert('O time ' + input_nome_do_time.value + ' tem ' + input_qtd_titulo.value + ' títulos');
    }
</script>

<!-- 6. Farol 
Crie um programa que:

Tenha três botões: "Pare", "Pense" e "Siga".
Ao clicar no 1º botão, aparece em um alerta a frase: "Pare e Aguarde!". 
Ao clicar no 2º botão, aparece em um alerta a frase: "Pense se pode seguir ou se deve parar!". 
Ao clicar no 3º botão, aparece em um alerta a frase: "Pode seguir adiante".
OBS: deveria exibir na página, mas por enquanto, faremos com alertas. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 06</title>
  </head>
  <body>
    <button onclick="stop()">Pare</button>
    <br />
    <button onclick="think()">Pense</button>
    <br />
    <button onclick="go()">Siga</button>
    <br />
  </body>
</html>
<script>
  function stop() {
    alert("Pare e Aguarde!");
  }
  function think() {
    alert("Pense se pode seguir ou se deve parar!");
  }
  function go() {
    alert("Pode seguir adiante.");
  }
</script>

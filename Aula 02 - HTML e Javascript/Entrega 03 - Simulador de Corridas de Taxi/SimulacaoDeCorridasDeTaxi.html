<!-- Simulação de Corridas de Táxi
Agostinho é taxista e inicia todos os dias de trabalho abastecendo seu carro com 25 litros de combustível.

Para acompanhar o consumo do veículo, ele deseja realizar simulações de suas corridas ao longo do dia.

O carro percorre, em média, 10 km com 1 litro de combustível.

Crie um programa que realize simulações de corridas, o qual:

a) Tenha um campo para o usuário informar a distância que será percorrida, em quilômetros (KM).

b) Tenha um campo para o usuário informar a velocidade média do carro, em quilômetros por hora (KM/h).

Ao clicar no botão "Simular", o programa deve: 

c) Calcular o tempo médio da corrida, considerando a distância e a velocidade informadas.

d) Calcular a quantidade de combustível gasto na corrida, em litros, e a porcentagem correspondente ao combustível gasto, 
considerando os 25 litros iniciais como 100%.

e) Calcular a quantidade de combustível restante, em litros, e a porcentagem correspondente ao combustível restante.

f) Exibir uma mensagem contendo os dados da corrida e os valores calculados, seguindo o formato:

Ao percorrer AA km, em velocidade média de BB km/h, a viagem durou CC horas. Ao todo, foram gastos DD litros de combustível (EE%). 
Restam FF litros de combustível (GG%).

g) Verificar se o combustível restante corresponde a 30% ou mais do combustível inicial.

Caso seja 30% ou mais, exibir: "Continue a rodar!"

Caso seja menor que 30%, exibir: "É melhor parar para reabastecer!"

 

Dicas e observações
Os 25 litros iniciais representam 100% do combustível disponível no início do dia.

O combustível gasto em cada corrida deve ser descontado do combustível disponível, para que a próxima simulação considere o valor atualizado.

Para calcular o tempo da corrida, utilize a relação entre distância e velocidade (velocidade dividido pela distância).

Para calcular o consumo, considere que o carro percorre 10 KM com 1 litro.

Para calcular um percentual, relacione a quantidade desejada com o valor inicial de 25 litros (Proporção com Regra de 3: 25 litros 
equivale a 100%, 5 litros equivale a quantos %?)

A verificação dos 30% deve considerar o combustível inicial, e não o combustível restante de uma corrida anterior (Deve validar se o 
combustível restante é maior ou igual a 30% dos 25 litros - 7.5 litros)

Utilize uma variável global (let) para controlar o combustível restante.

Utilize variáveis locais (let) para os dados e cálculos específicos de cada corrida.

O programa deve utilizar as operações +, -, / e * e uma estrutura de decisão if/else.

Exemplo de funcionamento: 
Realizar a primeira simulação com distância de "100 KM" com velocidade de "50 KM/h" deve exibir as frases: 

                "Ao percorrer 100 km, em velocidade média de 50 km/h, a viagem durou 2 horas. Ao todo, foram gastos 10 litro(s) de 
                combustível (40%). Restam 15 litro(s) de combustível (60%)."
                "Continue a rodar!"   - porque ainda resta 60% do combustível inicial

Ao realizar uma nova simulação com os mesmos valores, deve preservar o combustível anterior, exibindo: 
                "Ao percorrer 100 km, em velocidade média de 50 km/h, a viagem durou 2 horas. Ao todo, foram gastos 10 litro(s) de 
                combustível (40%). Restam 5 litro(s) de combustível (20%)." - gastou mais 40%
                "É melhor parar para reabastecer!"   - porque está abaixo de 30% do combustível inicial 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação de Corridas de Táxi</title>
</head>
<body>
    <h1>Simulação de Corridas de Táxi</h1>
    <span>Insira a distância que será percorrida(KM):</span>
    <input type="text" id="ipt_distancia">
    <br> <br>
    <span>Insira a velocidade do carro(KM/h):</span>
    <input type="text" id="ipt_velocidade">
    <br> <br>
    <button onclick="simular()">Simular</button>
    <br> <br>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    let combustivelRestante = 25;
    function simular(){
        let distancia = Number(ipt_distancia.value);
        let velocidade = Number(ipt_velocidade.value);

        let tempoCorrida = distancia / velocidade;
        
        let combustivelGasto = distancia / 10; // 10 km = 1L
        let combustivelGastoPorcentagem = 100 * combustivelGasto / 25;
        
        let combustivelRestantePorcentagem = 100 * combustivelRestante / 25 - combustivelGastoPorcentagem;
        combustivelRestante = combustivelRestante - combustivelGasto;
        
        div_exibir.innerHTML += `Ao percorrer ${distancia} km, em velocidade média de ${velocidade} km/h, a viagem durou ${tempoCorrida.toFixed(2)} horas. Ao todo, foram gastos ${combustivelGasto.toFixed(2)} litros de combustível (${combustivelGastoPorcentagem.toFixed(2)}%). Restam ${combustivelRestante.toFixed(2)} litros de combustível (${combustivelRestantePorcentagem}%).`;
        
        if(combustivelRestantePorcentagem >= 30){
            div_exibir.innerHTML += `<br>Continue a rodar! <br> <br>`;
        } else {
            div_exibir.innerHTML += `<br>É melhor parar para reabastecer! <br> <br>`;
        }
    }
</script>

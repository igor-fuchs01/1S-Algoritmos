<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora legal</title>
</head>
<body>
    <input id="input_num1" type="text">
    <input id="input_num2" type="text">
    <button onclick="multiplicar()">Multiplicar</button>
    <button onclick="dividir()">Dividir</button>
    <button onclick="subtrair()">Subtrair</button>
    <button onclick="somar()">Somar</button>

    <button onclick="tabzao()">Esse é o meu novo tab</button>
    <button onclick="inserir1()">Inserir 1</button>

    <div id="div_exibir"></div>
</body>
</html>
<script>
    function multiplicar(){
        let n1 = Number(input_num1.value);
        let n2 = Number(input_num2.value);
        let resultado = n1 * n2;
        div_exibir.innerHTML = `O resultado da multiplicação é: ${resultado}`;
    }
    function dividir(){
        let n1 = Number(input_num1.value);
        let n2 = Number(input_num2.value);
        let resultado = n1 / n2;
        div_exibir.innerHTML = `O resultado da divisão é: ${resultado}`;
    }
    function subtrair(){
        let n1 = Number(input_num1.value);
        let n2 = Number(input_num2.value);
        let resultado = n1 - n2;
        div_exibir.innerHTML = `O resultado da subtração é: ${resultado}`;
    }
    function somar(){
        let n1 = Number(input_num1.value);
        let n2 = Number(input_num2.value);
        let resultado = n1 + n2;
        div_exibir.innerHTML = `O resultado da soma é: ${resultado}`;
    }
    
    caixa_selecionada = 0;
    caixa = [input_num1, input_num2];
    function tabzao(){
        if(caixa_selecionada == 1){
            caixa_selecionada = 0
        } else {
            caixa_selecionada = 1
        }
    }
    function inserir1(){
        caixa[caixa_selecionada].value += 1;
    }
</script>
